<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome Back </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 380px;
            margin: 90px auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
        }

        .logo {
            width: 90px;
            margin-bottom: 5px;
        }

        .logo-text {
            font-size: 16px;
            font-weight: bold;
            color: #0d6efd;
            margin-bottom: 15px;
        }

        h2 {
            margin-bottom: 5px;
        }

        .welcome-msg {
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
        }

        .input-wrapper {
            position: relative;
            margin-top: 12px;
        }

        input, button {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        input {
            padding-right: 40px;
        }

        .show-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 14px;
            color: #888;
            user-select: none;
        }

        button {
            background: #0d6efd;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        .register-link {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .register-link a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .success {
            background: #e6fffa;
            color: #065f46;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Logo -->
    <img src="milk.jpg" alt="Milk Link Logo" class="logo">
    <div class="logo-text">MILK LINK</div>

    <h2>Welcome Back</h2>
    <div class="welcome-msg">Sign in to access your dashboard.</div>

    <form id="loginForm">
        <input id="username" placeholder="Username" required>
        <div class="input-wrapper">
            <input id="password" type="password" placeholder="Password" required>
            <span class="show-password" id="togglePassword">👁️</span>
        </div>
        <button type="submit" id="loginBtn">
            <span id="btnText">Login</span>
            <span id="btnLoader" style="display:none;">Loading...</span>
        </button>
    </form>

    <!-- Register link -->
    <div class="register-link">
        Don’t have an account?
        <a href="register.html">Register now</a>
    </div>

    <div id="formMessage" class="message"></div>
</div>

<script>
const loginForm = document.getElementById("loginForm");
const formMessage = document.getElementById("formMessage");
const btnText = document.getElementById("btnText");
const btnLoader = document.getElementById("btnLoader");
const togglePassword = document.getElementById("togglePassword");
const passwordInput = document.getElementById("password");

// Show/hide password
togglePassword.addEventListener("click", () => {
    const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
    passwordInput.setAttribute("type", type);
    togglePassword.textContent = type === "password" ? "👁️" : "🙈";
});

// Fetch with timeout helper
function fetchWithTimeout(url, options, timeout = 2000) { 
    return Promise.race([
        fetch(url, options),
        new Promise((_, reject) =>
            setTimeout(() => reject(new Error("Request timed out")), timeout)
        )
    ]);
}

loginForm.addEventListener("submit", async function(e) {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = passwordInput.value.trim();

    // Show loader
    btnText.style.display = "none";
    btnLoader.style.display = "inline";

    try {
        const res = await fetchWithTimeout("http://localhost:3001/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        }, 10000); // 10 seconds timeout

        const data = await res.json();

        if(res.ok && data.user && data.user.id) {
            // Save userId for dashboard
            localStorage.setItem("userId", data.user.id);
            localStorage.setItem("userName", data.user.fullname || username);

            // Redirect to user dashboard
            window.location.href = "user_dashboard.html";
        } else {
            formMessage.textContent = data.message || "Invalid username or password";
            formMessage.className = "message error";
            formMessage.style.display = "block";
        }
    } catch(err) {
        console.error(err);
        formMessage.textContent = err.message || "Server error. Try again later.";
        formMessage.className = "message error";
        formMessage.style.display = "block";
    } finally {
        btnText.style.display = "inline";
        btnLoader.style.display = "none";
    }
});
</script>

</body>
</html>
