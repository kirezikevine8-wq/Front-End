<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 380px;
            margin: 90px auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
        }

        button {
            background: #0d6efd;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        .register-link {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .register-link a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .success {
            background: #e6fffa;
            color: #065f46;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Login</h2>

    <form id="loginForm">
        <input id="username" placeholder="Username" required>
        <input id="password" type="password" placeholder="Password" required>
        <button type="submit" id="loginBtn">
            <span id="btnText">Login</span>
            <span id="btnLoader" style="display:none;">Loading...</span>
        </button>
    </form>

    <!-- Register link -->
    <div class="register-link">
        Don’t have an account?
        <a href="register.html">Register now</a>
    </div>

    <div id="formMessage" class="message"></div>
</div>

<script>
const loginForm = document.getElementById("loginForm");
const formMessage = document.getElementById("formMessage");
const btnText = document.getElementById("btnText");
const btnLoader = document.getElementById("btnLoader");

loginForm.addEventListener("submit", async function(e) {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    btnText.style.display = "none";
    btnLoader.style.display = "inline";

    try {
        // Call your login API
        const res = await fetch("https://milk-api-l8fd.onrender.com/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if(res.ok && data.user && data.user.id) {
            // Save the userId in localStorage for the dashboard
            localStorage.setItem("userId", data.user.id);
            localStorage.setItem("userName", data.user.fullname || username);

            // Redirect to the user dashboard
            window.location.href = "user_dashboard.html";
        } else {
            formMessage.textContent = data.message || "Invalid username or password";
            formMessage.className = "message error";
            formMessage.style.display = "block";
        }
    } catch(err) {
        console.error(err);
        formMessage.textContent = "Server error. Try again later.";
        formMessage.className = "message error";
        formMessage.style.display = "block";
    } finally {
        btnText.style.display = "inline";
        btnLoader.style.display = "none";
    }
});
</script>

</body>
</html>
