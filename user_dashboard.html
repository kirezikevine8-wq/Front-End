<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard</title>
    <link rel="stylesheet" href="user_dashboard.css">
</head>
<body>

<div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2 class="logo">USER PANEL</h2>

        <ul class="menu">
            <li class="active">Dashboard</li>
            <li><a href="my_deliveries.html">My Deliveries</a></li>
            <li><a href="my_payment.html">My Payments</a></li>
          
            <li><a href="#" onclick="logout(); return false;">Log Out</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main">

        <div class="header">
            <h1>Dashboard</h1>
            <p>Overview of your milk delivery and payments</p>
        </div>

        <div class="cards">

            <div class="card">
                <h4>Today's Delivery</h4>
                <h2 id="todaysDelivery">0 L</h2>
                <span class="note">Delivered today</span>
            </div>

            <div class="card revenue">
                <h4>Payment Balance</h4>
                <h2 id="paymentBalance">0 RWF</h2>
                <span class="note">Pending payment</span>
            </div>

            <div class="card">
                <h4>Last Payment</h4>
                <h2 id="lastPayment">0 RWF</h2>
                <span class="note" id="lastPaymentDate">Paid on N/A</span>
            </div>

        </div>

    </main>
</div>

<!-- ================= API Connection ================= -->
<script>
    // Get the userId dynamically from localStorage (set when user logs in)
    const userId = localStorage.getItem("userId");

    // If userId is missing, redirect to login page
    if (!userId) {
        window.location.href = "index.html";
    }

    const apiUrl = `https://node-uuig.onrender.com/api/user/${userId}/summary`;

    fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
            // Today's delivery
            document.getElementById("todaysDelivery").textContent = `${parseFloat(data.todays_delivery_quantity || 0).toFixed(2)} L`;

            // Payment balance
            document.getElementById("paymentBalance").textContent = `${Number(data.total_payments_amount || 0).toLocaleString()} RWF`;

            // Last payment
            if (data.last_payment) {
                document.getElementById("lastPayment").textContent = `${Number(data.last_payment.amount).toLocaleString()} RWF`;
                const date = new Date(data.last_payment.date);
                document.getElementById("lastPaymentDate").textContent = `Paid on ${date.toLocaleDateString()}`;
            }
        })
        .catch(error => {
            console.error("API error:", error);
            document.getElementById("todaysDelivery").textContent = "0 L";
            document.getElementById("paymentBalance").textContent = "0 RWF";
            document.getElementById("lastPayment").textContent = "0 RWF";
            document.getElementById("lastPaymentDate").textContent = "Paid on N/A";
        });

    // Logout function
    function logout() {
        localStorage.removeItem("userId");
        localStorage.clear();
        window.location.href = "index.html";
    }
</script>

</body>
</html>
